<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Soft scattered coffee beans + tea leaves for the light sage theme -->
  <defs>
    <g id="bean">
      <ellipse rx="12" ry="7.5" fill="#9c7a55" fill-opacity="0.4"/>
      <path d="M-9 1 C -4 -3, 4 3, 9 -1" fill="none" stroke="#6f4e30" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g id="leaf">
      <path d="M0 0 C 8 -11, 22 -11, 30 0 C 22 11, 8 11, 0 0 Z" fill="#a6c07d" fill-opacity="0.4"/>
      <path d="M3 0 L 27 0" stroke="#7f9d54" stroke-opacity="0.4" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g id="spark">
      <path d="M0 -6 L 1.4 -1.4 L 6 0 L 1.4 1.4 L 0 6 L -1.4 1.4 L -6 0 L -1.4 -1.4 Z" fill="#c9b06a" fill-opacity="0.34"/>
    </g>
  </defs>

  <use href="#bean" transform="translate(46 40) rotate(28)"/>
  <use href="#leaf" transform="translate(150 34) rotate(-18) scale(.9)"/>
  <use href="#bean" transform="translate(280 58) rotate(-40) scale(1.05)"/>
  <use href="#spark" transform="translate(214 70)"/>
  <use href="#leaf" transform="translate(64 120) rotate(38)"/>
  <use href="#bean" transform="translate(196 132) rotate(64) scale(.95)"/>
  <use href="#leaf" transform="translate(316 150) rotate(-60) scale(.85)"/>
  <use href="#bean" transform="translate(110 196) rotate(-14)"/>
  <use href="#leaf" transform="translate(250 206) rotate(20) scale(1)"/>
  <use href="#spark" transform="translate(38 214)"/>
  <use href="#bean" transform="translate(330 250) rotate(44) scale(.9)"/>
  <use href="#leaf" transform="translate(160 250) rotate(-46) scale(.9)"/>
  <use href="#bean" transform="translate(58 300) rotate(-58)"/>
  <use href="#leaf" transform="translate(280 320) rotate(14) scale(.95)"/>
  <use href="#bean" transform="translate(214 322) rotate(30) scale(1)"/>
  <use href="#spark" transform="translate(126 330)"/>
</svg>
